  - {id: r5_station, kind: station_chair, frame: room, room: 5, at: [16.8, 43.4, 0], facing: in, mount: free, left: _scratch/storyboard/station_chair/ai_window.png, image: _scratch/storyboard/station_chair/video_middle.png, video: media/videos/hyperoptimized_engineer_000000_000020.mp4, video_screen: image, video_from: "05.1a", right: _scratch/storyboard/station_chair/terminal.png, credit: hyperoptimized_engineer}   # video_from: the clip starts at 0 when the ride sets off towards 05.1a, not on entering room 5; video: excerpt 0:46 to 1:06, plays during the ride
