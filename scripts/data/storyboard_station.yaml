  # - {id: r5_pic_2, kind: board, frame: wall, room: 5, at: [0, 0.05, 4.4], facing: out, size: [6, 3.6], text: "MURAL\n(placeholder)"}
  # Room divider free in the room: at s = 15 the straight inner wall is already at r = 39, so a divider at r 37.6 to 44.4 sat
  # inside it; at s = 10 (inner wall r 37.4), 3 m wide from r 39.4 to 45.4, it has 1 m clearance to the inner wall and a
  # 1.5 m passage on the outside along the shelves.
  # s 12 instead of 10: moved further back, at s 10 it intersected the table r5_table_2
  - {id: r5_divider, kind: divider, frame: room, room: 5, at: [12, 42.4, 0], facing: back, size: [3.0, 1.94], image: _scratch/storyboard/centaur_front.png, back_image: _scratch/storyboard/centaur_back.png, credit: doctorow_reverse_centaur, back_credit: doctorow_speech_image}
  # Chair station modelled on the video "Hyperoptimized Engineer 2026" (it adds a touch of dystopia): the reclining person
