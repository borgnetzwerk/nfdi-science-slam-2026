  - {id: r5_wall_text, kind: board, decal: true, frame: wall, room: 5, at: [-2, 0.02, 6.2], facing: out, size: [15, 6.0], font: "Kommunikation/Website/2026-10-15_Corporate_Design/_fonts_raw/OpenSans[wdth,wght].ttf", weight: 0.006, text: "The underlying purpose of AI\nis to allow wealth\nto access skill\nwhile removing from skill\nthe ability to access wealth.", attribution: "Joseph Browning, 2024", credit: browning_ai_purpose}
  # Armchairs removed (they had no purpose in the room); earlier r5_chair_1 to 3 at s 14 to 16.8, r 47.8
