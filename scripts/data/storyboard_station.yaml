scenes:
  - scene: 1
    title: "Titelfolie"
    place: "Room 1"
    feeling: "arriving (3)"
    panels:
      # The talk starts head-on in front of the title slide; the door need not be seen at first, at most out of the corner of
      # the eye. From the slide the path goes left to the banner (01.4).
      - id: "01.1"
        shot: CU
        angle: eye
        move: static
        click: true
        seconds: 15
        camera: {frame: wall, room: 1, at: [12, 9, 1.65], look: [12, 0, 3.8], lens: 32}
        fit: [r1_title]
        fill: true   # the dimensions of the title slide match the camera frame exactly
        main_door: closed
        shows: "Head-on in front of the title slide on the inner wall of room 1: it fills the frame like a slide"
        speech: "[speaker: welcome, what today is about]"
        missing: ["title slide"]
        status: idea
      - id: "01.4"
        shot: MS
        angle: low
        move: track
        click: true
        seconds: 8
