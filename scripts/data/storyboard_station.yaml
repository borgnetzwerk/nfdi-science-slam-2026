# Storyboard of the station for the NFDI Science Slam 2026.
# The museum faces the foot of the spoke with its gate; the lift tower stands 9 m in front of the gate. The main door of the
# middle hall is closed at the start (main_door: closed). The timeline in room 2 fills the wall without a frame; the screens
# in room 3 and the timeline of the proposals in room 4 are large; the banner above the door hangs between lintel and
# ceiling. Room 6 is the making-of room; the middle hall holds only the globe and the threads.
# Open decisions are filled in with a proposal (field decision).
#
# Images: python scripts/blender_run.py station_scene.py --building --storyboard storyboard_station.yaml [--panels 01.1,05.3]
#         [--museum-scale 1]   output to a scratch folder (960 x 540, kept small); sheet: python scripts/build_storyboard_sheet.py
# Build the panel images first: scripts/make_timeline_wall.py, make_plaques.py --talk, make_proposal_timeline.py,
# make_centaur_banner.py, make_making_of_boards.py, make_museum_plan_2d.py (all called from the presentation folder).
#
# Fields per panel: id (scene.shot), shot (EWS, WS, FS, MS, CU, ECU), angle (eye, low, high, bird, pov), move (how the camera
# reaches this panel: static, dolly in, dolly out, track, pan, tilt, crane up, crane down, cut), click (true: stop, the ride
# waits for the clicker here; false: key frame within a move), seconds (duration of the panel in the talk, stop with
# speaking), camera, fit (ids of placeholders, or "book": must lie fully in the frame), main_door (closed: the main door of
# the middle hall is shut), shows (what you should see), speech (stage text in English, from the dramaturgy or a placeholder
# a bracketed placeholder for the speaker), missing (what the grey box does not show yet: the build list), decision (open decision,
# proposal filled in), status (idea, discussed, fixed).
#
# All museum dimensions apply to scale 1 (diameter 100 m) and are reduced with museum_scale; the camera eye height, lectern,
# furniture, Borgis, reading desks, room dividers and easels stay at human scale.
# Camera (camera): frame ring: at/look = [along, depth, height] in m as in tour_station.yaml (along with the rotation from
#   spoke 0, depth shadeward from the sun side of the ring, height above the floor; museum: centre at [0, 100], gate at depth
#   125, foot of the spoke at [0, 140]); the top of the image points towards the axis.
# frame room: at/look = [s, r, height] in room room (1 to 6) of the museum: r = distance from the museum centre (middle hall
#   up to 36.4 at the middle of a side, rooms up to 50 = outer wall), s = m along the circle of radius r in the walking
#   direction (to the left, room 1 to room 2) from the middle of the room; the partition walls are at s / r = ±30°. Room 1 is
#   at the gate (shadow side, 90° in the plan).
# frame wall: at/look = [x, d, height] at the flat inner wall of room room: x = m along the wall in the walking direction from
#   the middle of the wall (wall 42 m long), d = m in front of the wall into the room (outer wall at d = 13.6 in the middle,
#   8 at the corners). Panels there (facing out) get a back and a cable through the wall; in the middle hall their thread to
#   the globe starts there.
# frame hall: at/look = [dx, dy, height] in the middle hall from the museum centre (dx with the rotation, dy shadeward; the
#   main door is at dy = +36, room 4 at dy < 0); panels there use facing_deg (direction of the normal in the plan: 0 with the
#   rotation, 90 shadeward).
# frame spoke: at/look = [distance, side, z] in spoke 0: distance = m from the axis (ring floor 286.5, ring ceiling 246.5),
#   side = m across, z = m towards the sun from the middle of the spoke; up gives the direction at the top of the image
#   (default: towards the sun).
# frame hub: at/look = [x, y, z] as in station_scene.py (z towards the sun, collector z = 0); instead of numbers also
#   {module: id, offset: [x, y, z]} with the centre of a module from hub_layout_cells.yaml.
# lens in mm (not below 24 mm in rooms without a horizon; in the museum 18 to 24 mm for wide shots).

talk: "NFDI Science Slam 2026: Going Wild with AI"
target_minutes: 10
aspect: "16:9"
image: {width: 960, height: 540, samples: 16}
status: idea
# Grey-box objects hidden in the storyboard because a proposal moves them elsewhere
hide_objects: []   # the globe in the map room is visible again, only hinted at; earlier ["Kugel im Kartenraum"]

# Placeholders in the rooms (fixing the rooms). Kinds: board (panel with text or image; no_rim without a dark frame; backing
# adds a dark carrier plate), box, shelves, lectern (book), flat (backdrop), table (table with stools), armchair, borgi
# (cut-out figure from media/visual_design), rollup (roll-up banner), divider (room divider with front and back), plate
# (reading desk, tilted), easel (easel with a panel at human scale). facing: out (from the inner wall into the room), in
# (from the outer wall towards the centre), back (across, towards someone entering). mount (collision check): free (free in
# the room, no intersection with walls), wall (back against the wall; default for frame wall with facing out and for
# shelves), embedded (set into the wall, intersection intended).
# above_passage: true hangs the panel directly above the passage (lower edge banner_gap above passage_height from building.yaml).
placeholders:
  # Room 1: in the middle of the inner wall the main door to the middle hall (x = -5.25 to 5.25), on the axis of the gate,
  # visible from the start and closed at first; the title slide hangs to the left of the centre door: +x points in the
  # walking direction towards room 2, i.e. to the left for someone looking from the gate at the inner wall.
  # Centre at 1.9 m (3.8 at scale 1): seen head-on from eye height like a slide, not distorted from below (01.1)
  - {id: r1_title, kind: board, frame: wall, room: 1, at: [12, 0.05, 3.8], facing: out, size: [9.2, 5.2], image: _scratch/storyboard/title/title_slide.png}   # the speaker's title slide (Folien/Titelfolie.pptx, slide 1, via slide_boards.yaml), refreshed before every run
  # Above the passage, the banner of today's exhibition, between the door lintel (4 m) and the ceiling (6 m at half scale),
  # in front of the partition wall (not inside the door opening).
  # Height from the lintel (above_passage): lower edge banner_gap above passage_height from building.yaml; the 10.2 applies only without that field
  # Fabric instead of a carrier plate (fabric; a plate looked like a TV screen): folds, cords, a rod on two brackets to the wall
  - {id: r1_banner, kind: board, frame: room, room: 1, at: [22.9, 46, 10.2], above_passage: true, facing: back, size: [6, 3.4], no_back: true, fabric: true, image: _scratch/ride/cards/foyer_banner.png}
  # Room 2: the timeline of the talks fills the inner wall (42 x 12 m at scale 1), without a frame (a framed version was far
  # too small); generated by scripts/make_timeline_wall.py from videos.yaml (own_talks)
  - {id: r2_timeline, kind: board, frame: wall, room: 2, at: [0, 0.05, 6.0], facing: out, size: [36, 9], segments: 8, seamless: true, no_rim: true, image: _scratch/storyboard/timeline_wall.png}   # seamless: avoids vertical lines at the strip joints (takes effect in the next render)
  # Room 3: three large TVs in front of the wall (12 x 6.75 m, box with frame); centred in front of each a wide reading desk
  # on a solid pedestal (3 x 0.8 m at human scale, 30° tilt) that carries everything: title, creator, metadata (no separate
  # title plate below the screen; scripts/make_plaques.py, <id>_lectern.png)
  # Screens 0.25 m higher than before (z 7.4 instead of 6.9, lower edge 2.01 m): from eye height the top edge of the desk
  # (1.71 m) otherwise covered the bottom of the picture and seemed to poke into it; top edge 5.39 m below the ceiling
  - {id: r3_s1, kind: board, frame: wall, room: 3, at: [-14, 0.35, 7.4], facing: out, size: [12, 6.75], image: _scratch/storyboard/stills/ultralativ_youtube_de.jpg, video: media/videos/ultralativ_youtube_de_000440_000500.mp4, credit: ultralativ_youtube_de}   # video: plays during the ride
  # Desks: d scales with the museum scale (3.0 becomes 1.5 m), the plate does not; at 55° it reaches 0.92 m back, rear edge
  # 0.58 m in front of the wall (with d 2.6 and 38° it was 4 cm, i.e. clipping into the screen); top edge 0.4 + 1.31 = 1.71 m,
  # below the lower edge of the screen at 1.76 m. Not oversized.
  - {id: r3_s1_plate, kind: plate, frame: wall, room: 3, at: [-14, 3.0, 0.4], facing: out, size: [4.8, 1.6], tilt: 55, pedestal: true, image: _scratch/storyboard/plaques/ultralativ_youtube_de_lectern.png}
  - {id: r3_s2, kind: board, frame: wall, room: 3, at: [0, 0.35, 7.4], facing: out, size: [12, 6.75], image: _scratch/storyboard/stills/not_david_nerds.jpg, video: media/videos/not_david_nerds_000510_000530.mp4, credit: not_david_nerds}
  - {id: r3_s2_plate, kind: plate, frame: wall, room: 3, at: [0, 3.0, 0.4], facing: out, size: [4.8, 1.6], tilt: 55, pedestal: true, image: _scratch/storyboard/plaques/not_david_nerds_lectern.png}
  - {id: r3_s3, kind: board, frame: wall, room: 3, at: [14, 0.35, 7.4], facing: out, size: [12, 6.75], image: _scratch/storyboard/stills/adumb_wikipedia_graph.jpg, video: media/videos/adumb_wikipedia_graph_000100_000120.mp4, credit: adumb_wikipedia_graph}
  - {id: r3_s3_plate, kind: plate, frame: wall, room: 3, at: [14, 3.0, 0.4], facing: out, size: [4.8, 1.6], tilt: 55, pedestal: true, image: _scratch/storyboard/plaques/adumb_wikipedia_graph_lectern.png}
  # Room 4: timeline of drafts and proposals across most of the inner wall without a frame (scripts/make_proposal_timeline.py
  # from proposal_timeline.yaml), ending in the vision; glass roof. 9 m high, in strips along the curvature like room 2.
  # Time runs in the walking direction (timeline_direction: walk in scripts/config.yaml): 2021 at the entrance at -x,
  # "today" at +x, then the vision.
  # Wider, to use more of the wall and spread the content: the left edge stays at -20.5, the right goes to 14.5 (wall up to 21)
  - {id: r4_timeline, kind: board, frame: wall, room: 4, at: [-3.0, 0.05, 6.0], facing: out, size: [35, 9], segments: 9, seamless: true, no_rim: true, image: _scratch/storyboard/proposal_wall.png}   # seamless: strips without overlap, corners on the same wall points (prevents flicker)
  # A separate vision wall was dropped: the end of the timeline is the vision.
  # Room 5: a library with life in it; the lectern with the book stands in the walking axis, in the way, and is read from the
  # shelf side; tables and Borgis near the inner wall, the walking axis (r 42 to 46) stays free; in front of the exit the
  # room divider with the cover of the reverse centaur, passage only on the outside along the shelves
  - {id: r5_shelves, kind: shelves, frame: room, room: 5, at: [-22, 49.2, 0], to: 22, unit: 4.0, height: 3.2}
  - {id: r5_lectern, kind: lectern, frame: room, room: 5, at: [-12, 45, 0], facing: out, left: _scratch/book/spread_title_left.png, image: _scratch/book/spread_title_right.png}
  - {id: r5_table_1, kind: table, frame: wall, room: 5, at: [-11, 3.0, 0], facing: out, turn: 20}
  - {id: r5_table_2, kind: table, frame: wall, room: 5, at: [5, 3.5, 0], facing: out, turn: 50}   # x 5 instead of 8: keeps clear of the room divider
  - {id: r5_borgi_1, kind: borgi, frame: wall, room: 5, at: [-12.4, 2.2, 0], facing: back, image: media/visual_design/borgi_question.png}
  - {id: r5_borgi_2, kind: borgi, frame: wall, room: 5, at: [-9.8, 4.0, 0], facing: back, image: media/visual_design/borgi_exclaim.png}
  - {id: r5_borgi_3, kind: borgi, frame: wall, room: 5, at: [6.3, 2.5, 0], facing: back, image: media/visual_design/borgi_thinking.png}
  - {id: r5_borgi_4, kind: borgi, frame: wall, room: 5, at: [3.8, 4.6, 0], facing: back, image: media/visual_design/borgi_pointing.png}
  # Wall lettering on the right of the straight inner wall of the lessons-learned room. Wording by Joseph Browning, quoted
